name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # Blocking gate — the test suite is hermetic (temp SQLite, sources disabled,
      # no live keys/network) and currently green.
      - name: Tests
        run: uv run pytest -q

      # Blocking gate — lint must pass (ruff pinned in pyproject; debt cleared).
      - name: Ruff lint
        run: uv run ruff check .

      # Blocking gate — ruff is pinned in pyproject (ruff==0.15.13), so a newer
      # ruff cannot change the formatting rules under us; the only way this
      # fails is an unformatted file. Run `uv run ruff format .` before pushing.
      - name: Ruff format
        run: uv run ruff format --check .

      # Intentionally NOT a gate: mypy is new to a codebase that predates it, so
      # it reports rather than blocks. Config (lenient on purpose) lives in
      # pyproject.toml under [tool.mypy]. Tighten it, then promote this step.
      - name: mypy (informational)
        run: uv run mypy
        continue-on-error: true

  frontend:
    name: frontend (typecheck + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      # Blocking gate — currently green.
      - name: Typecheck
        run: yarn typecheck

      # Blocking gate — ESLint must pass (errors cleared).
      - name: Lint
        run: yarn lint

      # Blocking gate — vitest unit suite (canvas store + template (de)serialization).
      - name: Tests
        run: yarn test
