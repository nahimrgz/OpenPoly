[project]
name = "openpoly"
version = "0.0.0"
description = "Experimental Polymarket live-trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KoNananachan" }]
maintainers = [{ name = "KoNananachan" }]
keywords = ["polymarket", "prediction-markets", "trading", "fastapi", "react", "sqlite"]
dependencies = [
    "anthropic>=0.104.0",
    "eth-account>=0.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8",
    "py-clob-client-v2==1.0.1rc1",
    "sentence-transformers>=5.5.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "web3>=6",
    "websockets>=14",
]

[project.urls]
Homepage = "https://github.com/KoNananachan/OpenPoly"
Repository = "https://github.com/KoNananachan/OpenPoly"
Issues = "https://github.com/KoNananachan/OpenPoly/issues"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff==0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openpoly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

# A blocking CI gate (see .github/workflows/ci.yml): the tree type-checks clean
# and must stay that way. Still lenient on purpose about third-party stubs —
# the SDK surface (py-clob-client, sentence-transformers, web3) ships no usable
# ones, hence ignore_missing_imports. `tests/` is outside `files` on purpose:
# it carries a ~100-error backlog of duck-typed fakes, and adding it now would
# only bring continue-on-error back. Tightening beyond that is a deliberate
# later step.
[tool.mypy]
python_version = "3.12"
files = ["openpoly"]
ignore_missing_imports = true
warn_unused_configs = true
